{# A non-owning tab remains read-only until explicit Take control; displaced tabs
   learn the change on their next request. #}
<div class="banner banner--warn" role="{{ 'alert' if error else 'status' }}">
  <span class="banner__icon" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.3 4.2 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0Z"></path>
      <path d="M12 9 L12 13"></path>
      <path d="M12 17 L12.01 17"></path>
    </svg>
  </span>

  <div id="rig-read-only">
    <b>Read-only.</b>
    {% if error %}
      {{ error }}
    {% else %}

      Another browser has control of this rig.
    {% endif %}
  </div>
  <form class="banner__action" method="post" action="/take-control">
    <button class="btn" type="submit">Take control</button>
  </form>
</div>
