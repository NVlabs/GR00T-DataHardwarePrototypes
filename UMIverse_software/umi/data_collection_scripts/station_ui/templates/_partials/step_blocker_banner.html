{# Render unreached steps with their blocker instead of redirecting and breaking
   browser history. Enforce actual safety at action endpoints. #}
{% if step_blocker %}
<div class="banner banner--warn" role="status">
  <span class="banner__icon" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4 L21 19 L3 19 Z"></path>
      <path d="M12 10 L12 14"></path>
      <path d="M12 16.5 L12.01 16.5"></path>
    </svg>
  </span>

  <div>
    <b>{{ step_blocker.step }} is not done yet.</b>
    {{ step_blocker.message }}
    <a href="{{ step_blocker.href }}">{{ step_blocker.action }}</a>
  </div>
</div>
{% endif %}
