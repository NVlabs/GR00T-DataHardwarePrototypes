timestamp:
  fps_deviation_pct: 10.0
  coverage_threshold: 0.95
  max_missing_frames: 4.0
  frame_drop_window_s: 1.0
  frame_drop_min_fps_ratio: 0.7
  enabled: true
gripper:
  movement_threshold_mm: 10.0
  jump_threshold_mm_per_s: 2000.0
  range_min_mm: -2.0
  range_max_mm: 85.0
  enabled: true
tracking:
  pose_movement_threshold_m: 0.01
  pose_downsample: 10
  consecutive_min_movement_m: 0.0005
  consecutive_required_ratio: 0.8
  multi_tracking_consecutive_required_ratio: 0.15
  pose_jump_threshold_m_per_s: 4.5
  enabled: true
arm_steady_before_close:
  enabled: true
  hold_duration_s: 0.3
  steady_threshold_m: 0.05
  close_threshold_mm: 3.0
  window_frames: 5
  min_gap_frames: 90
  stable_threshold_mm: 2.0
  gripper_initial_distance_range:
  - 55.0
  - 85.0
device_name_consistency:
  optional_devices:
  - head_tracking_camera
  - head_umi_camera
  - left_trigger_camera
  - right_trigger_camera
  left_video_sources:
  - left_tracking_camera
  - left_umi_camera
  right_video_sources:
  - right_tracking_camera
  - right_umi_camera
  left_numeric_sources:
  - left_umi_gripper
  right_numeric_sources:
  - right_umi_gripper
  enabled: true
duration:
  default:
    min_duration_s: 190.0
    max_duration_s: 225.0
  plane_assembly_v11:
    min_duration_s: 190.0
    max_duration_s: 225.0
  enabled: true
latency:
  expected_gripper_latency: 0.084
  enabled: true
idle:
  max_idle_duration_s: 5.0
  tracking_movement_threshold_m: 0.002
  gripper_movement_threshold_mm: 1.0
  total_displacement_threshold_m: 0.01
  gripper_total_displacement_threshold_mm: 2.0
  enabled: true
video_resolution:
  enabled: true
