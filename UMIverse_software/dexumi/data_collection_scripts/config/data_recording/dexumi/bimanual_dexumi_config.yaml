# Bimanual DexUMI records one tracking iPhone, wrist OAK, encoder and tactile
# source per hand. Use distinct uart_device_name values and calibration
# basenames: shared identities can make both arms read one board. Each named
# device must match its side's calibration file. Calibrate both hands with
# calibrate_exo.py and set camera IDs through GUI identification before use.





















# Meta
meta:
  operator_name: Operator name
  task_name: task_name
  task_description: Task description
  embodiment: bimanual_dexumi
  use_head_mount: true

# General recording settings
recording:
  data_dir: "output/bimanual_dexumi_session"
  # global default
  record_fps: 45
  stream_fps: 60
  verbose: false
  video_encoder: ffmpeg_h264
  # Frame types
  video_frame_type: RGBCameraFrame
  # A bimanual session is invalid if even one camera or exoskeleton fails to
  # initialize. Recorder factories raise instead of silently dropping it.
  require_all_sources: true

# Each side requires iPhone RGB/pose and wrist RGB. Depth is not recorded
# because this collection schema does not consume it.




video_sources:
  - type: iphone_camera
    name: right_tracking_camera
    record_fps: 45
    stream_fps: 60
    frame_type: RGBCameraFrame  # RGB + pose only; RGBDCameraFrame would add LiDAR depth
    latency: 0.1     # iphone_camera sensor latency (seconds)
    params:
      iphone_udid: "RIGHT-IPHONE-UDID"  # the phone's UDID

  - type: iphone_camera
    name: left_tracking_camera
    record_fps: 45
    stream_fps: 60
    frame_type: RGBCameraFrame  # RGB + pose only; RGBDCameraFrame would add LiDAR depth
    latency: 0.1
    params:
      iphone_udid: "LEFT-IPHONE-UDID"

  - type: oak_camera
    name: right_umi_camera
    frame_type: RGBCameraFrame
    latency: 0.05   # oak_camera sensor latency (seconds)
    params:
      oak_device_id: "RIGHT-WRIST-OAK-ID"  # the camera's depthai device ID
      camera_resolution: [640, 400]
      fps: 45
      enable_color: true
      enable_mono_cameras: false

  - type: oak_camera
    name: left_umi_camera
    frame_type: RGBCameraFrame
    latency: 0.05
    params:
      oak_device_id: "LEFT-WRIST-OAK-ID"
      camera_resolution: [640, 400]
      fps: 45
      enable_color: true
      enable_mono_cameras: false

  - type: oak_camera
    name: head_umi_camera
    frame_type: RGBCameraFrame
    latency: 0.06
    params:
      oak_device_id: "HEAD-OAK-ID"
      camera_resolution: [640, 400]
      fps: 45
      enable_color: true
      enable_mono_cameras: false

# Numeric sources — one DexUMI exoskeleton per side (encoder + tactile each).
numeric_sources:
  - type: dexumi_exoskeleton
    name: right_dexumi_exoskeleton
    uart_device_name: "DEXUMI-Right"  # calibration name (distinct per side!)
    reader_baudrate: 1000000
    record_fps: 45
    stream_fps: 60
    latency: 0.034 # exoskeleton sensor latency (seconds), applied at alignment
    params:
      config_file: "config/dexumi_exoskeleton/DEXUMI-Right.yaml"

  - type: dexumi_exoskeleton
    name: left_dexumi_exoskeleton
    uart_device_name: "DEXUMI-Left"
    reader_baudrate: 1000000
    record_fps: 45
    stream_fps: 60
    latency: 0.034
    params:
      config_file: "config/dexumi_exoskeleton/DEXUMI-Left.yaml"

# Background alignment settings (runs in a daemon process during collection)
alignment:
  enabled: true
  index_sources: "right_umi_camera,left_umi_camera"  # tried in order; first match wins
  downsample: 1        # 1 = keep every frame
  copy_videos: true    # copy mp4s into aligned output
  aligned_dir:       # by default, aligned data is saved next to raw with _aligned suffix
  align_timeout: 300

# Visualization settings
visualization:
  enabled: true
  dashboard: true    # Camera mosaic + separate tactile hand tables
  resizable: true     # Drag the OpenCV window edges to resize the preview
  window_width: 1800  # Initial size; live resizing re-renders the dashboard text
  window_height: 1100
  fps: 30
  window_name: "Bimanual DexUMI Recording"
  show_fps: true
  show_episode_id: true
  layout: bimanual  # Left/right tracking above wrist; head centered between them
  overlay_numeric: true
  overlay_position: [10, 60]
  text_scale: 0.5      # Multiplier for numeric/pose overlay font size
  tactile_components: [fz]  # Preview axes; use [fx, fy, fz] for all three
  tactile_text_scale: 1.0   # Table font scale; independent of text_scale
  values_per_line: 8   # Wrap arrays onto a new line after this many values
